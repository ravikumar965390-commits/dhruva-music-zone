<!DOCTYPE html>
<html lang="hi">
<head>
<meta name="google-site-verification" content="_-w-hFJyJav9wWJKZO12Kuxklu_BswDekcY-nD7vl_Q" />
<meta name="description" content="DHRUVA MUSIC ZONE – Listen, discover and enjoy music online.">
<meta name="robots" content="index, follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHRUVA MUSIC ZONE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d0b18;
  color:white;
}
header{
  padding:28px 15px;
  text-align:center;
  background:linear-gradient(135deg,#35106b,#711c8f);
}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;color:#ddd}

.search{
  padding:20px 15px;
  text-align:center;
}
.search input{
  width:100%;
  max-width:600px;
  padding:15px;
  border:0;
  border-radius:30px;
  font-size:16px;
  outline:none;
}

.categories{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:0 15px 20px;
}
.categories button{
  padding:10px 18px;
  border:1px solid #8e45b5;
  border-radius:20px;
  background:#191328;
  color:white;
  cursor:pointer;
}
.categories button:hover{
  background:#8e45b5;
}

.music-list{
  max-width:850px;
  margin:auto;
  padding:10px 15px 40px;
}

.song{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:18px;
  margin-bottom:12px;
  background:#181426;
  border:1px solid #29223b;
  border-radius:15px;
}

.song-info{
  min-width:0;
}
.song-info h3{
  margin:0 0 6px;
  font-size:18px;
}
.song-info p{
  margin:0;
  color:#aaa;
  font-size:14px;
}

.actions{
  display:flex;
  gap:8px;
}
.actions button{
  border:0;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
.play{
  background:#8e45b5;
  color:white;
}
.download{
  background:#2d9d63;
  color:white;
}

.player-box{
  position:sticky;
  bottom:0;
  background:#110e1d;
  padding:15px;
  border-top:1px solid #332842;
}
audio{
  width:100%;
  max-width:850px;
  display:block;
  margin:auto;
}

footer{
  text-align:center;
  padding:25px 15px;
  color:#888;
  font-size:13px;
}

@media(max-width:600px){
  .song{
    flex-direction:column;
    align-items:flex-start;
  }
  .actions{
    width:100%;
  }
  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎵 DHRUVA MUSIC ZONE</h1>
  <p>Listen • Discover • Enjoy Music</p>
</header>

<div class="search">
  <input type="text" id="search" placeholder="🔍 Search song or artist...">
</div>

<div class="categories">
  <button onclick="showCategory('All')">All</button>
  <button onclick="showCategory('Hindi')">Hindi</button>
  <button onclick="showCategory('English')">English</button>
  <button onclick="showCategory('Instrumental')">Instrumental</button>
</div>

<div class="music-list" id="musicList"></div>

<div class="player-box">
  <audio id="player" controls></audio>
</div>

<footer>
  © 2026 DHRUVA MUSIC ZONE
</footer>

<script>

const music = [

  {
title:"Hum Juda Ho Gaye",
    artist:"DHRUVA MUSIC ZONE",
    category:"Hindi",
    file:"songs/Hum Juda Ho Gaye.mp3"
  },

  {
    title:"English Music",
    artist:"DHRUVA MUSIC ZONE",
    category:"English",
    file:"songs/song2.mp3"
  },

  {
    title:"Peaceful Instrumental",
    artist:"DHRUVA MUSIC ZONE",
    category:"Instrumental",
    file:"songs/song3.mp3"
  }

];

const list = document.getElementById("musicList");
const player = document.getElementById("player");
const search = document.getElementById("search");

function displaySongs(data){

  list.innerHTML="";

  if(data.length===0){
    list.innerHTML="<p style='text-align:center;color:#aaa'>No music found.</p>";
    return;
  }

  data.forEach(song=>{

    const div=document.createElement("div");
    div.className="song";

    div.innerHTML=`
      <div class="song-info">
        <h3>🎵 ${song.title}</h3>
        <p>${song.artist} • ${song.category}</p>
      </div>

      <div class="actions">
        <button class="play" onclick="playSong('${song.file}')">
          ▶ Play
        </button>

        <a href="${song.file}" download>
          <button class="download">
            ⬇ Download
          </button>
        </a>
      </div>
    `;

    list.appendChild(div);

  });
}

function playSong(file){
  player.src=file;
  player.play();
}

function showCategory(category){

  if(category==="All"){
    displaySongs(music);
    return;
  }

  displaySongs(
    music.filter(song=>song.category===category)
  );
}

search.addEventListener("input",function(){

  const text=this.value.toLowerCase();

  displaySongs(
    music.filter(song=>
      song.title.toLowerCase().includes(text) ||
      song.artist.toLowerCase().includes(text)
    )
  );

});

displaySongs(music);

</script>

</body>
</html>
