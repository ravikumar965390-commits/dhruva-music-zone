<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHRUVA MUSIC ZONE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#08080f;
    color:white;
}

header{
    background:linear-gradient(135deg,#17112d,#4b168a);
    padding:28px 15px;
    text-align:center;
}

header h1{
    font-size:30px;
    letter-spacing:2px;
}

header p{
    margin-top:8px;
    color:#d2d2d2;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.search{
    width:100%;
    padding:16px;
    border:1px solid #292936;
    border-radius:12px;
    background:#15151f;
    color:white;
    font-size:16px;
    outline:none;
    margin-bottom:18px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:20px;
}

.categories button{
    border:none;
    background:#1b1b27;
    color:white;
    padding:10px 17px;
    border-radius:25px;
    cursor:pointer;
    white-space:nowrap;
}

.categories button:hover{
    background:#7437e8;
}

.player{
    width:100%;
    margin-bottom:20px;
}

.song{
    display:flex;
    align-items:center;
    gap:13px;
    background:#15151f;
    padding:13px;
    margin-bottom:10px;
    border-radius:14px;
}

.cover{
    width:55px;
    height:55px;
    min-width:55px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:linear-gradient(135deg,#7b2fe0,#e83e8c);
}

.song-info{
    flex:1;
    min-width:0;
}

.song-info h3{
    font-size:16px;
    margin-bottom:5px;
}

.song-info p{
    color:#999;
    font-size:13px;
}

.btn{
    border:none;
    text-decoration:none;
    color:white;
    background:#6933d5;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
    font-size:13px;
}

.btn:hover{
    background:#874ff0;
}

.download{
    background:#168a55;
}

.download:hover{
    background:#20ad6d;
}

.empty{
    text-align:center;
    color:#888;
    padding:30px;
}

footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:30px 10px;
}

@media(max-width:600px){
    .song{
        flex-wrap:wrap;
    }

    .song-info{
        width:calc(100% - 70px);
    }

    .btn{
        flex:1;
        text-align:center;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎵 DHRUVA MUSIC ZONE</h1>
    <p>Listen • Discover • Download</p>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Song, artist ya album search karein..."
    >

    <div class="categories">
        <button onclick="category('All')">All</button>
        <button onclick="category('Hindi')">Hindi</button>
        <button onclick="category('English')">English</button>
        <button onclick="category('Instrumental')">Instrumental</button>
    </div>

    <audio id="player" class="player" controls></audio>

    <div id="songs"></div>

</div>

<footer>
    © 2026 DHRUVA MUSIC ZONE
</footer>

<script>

const music = [

    {
        title:"Apna Song 1",
        artist:"Artist Name",
        album:"Album Name",
        category:"Hindi",
        file:"songs/song1.mp3"
    },

    {
        title:"Apna Song 2",
        artist:"Artist Name",
        album:"Album Name",
        category:"Hindi",
        file:"songs/song2.mp3"
    },

    {
        title:"My Music",
        artist:"Artist Name",
        album:"My Album",
        category:"English",
        file:"songs/song3.mp3"
    },

    {
        title:"Peaceful Music",
        artist:"Artist Name",
        album:"Instrumental",
        category:"Instrumental",
        file:"songs/song4.mp3"
    }

];

let selectedCategory="All";

function playSong(index){

    const player=document.getElementById("player");

    player.src=music[index].file;

    player.play();

}

function category(cat){

    selectedCategory=cat;

    displaySongs();

}

function displaySongs(){

    const searchText=
        document.getElementById("search")
        .value
        .toLowerCase();

    const list=document.getElementById("songs");

    const filtered=music
        .map((song,index)=>({...song,index}))
        .filter(song=>{

            const matchesCategory=
                selectedCategory==="All" ||
                song.category===selectedCategory;

            const text=
                (song.title+" "+
                 song.artist+" "+
                 song.album).toLowerCase();

            return matchesCategory &&
                   text.includes(searchText);

        });

    if(filtered.length===0){

        list.innerHTML=
            '<div class="empty">😔 Song nahi mila</div>';

        return;
    }

    list.innerHTML=filtered.map(song=>`

        <div class="song">

            <div class="cover">♪</div>

            <div class="song-info">

                <h3>${song.title}</h3>

                <p>
                    ${song.artist} • ${song.album}
                </p>

            </div>

            <button
                class="btn"
                onclick="playSong(${song.index})">
                ▶ Play
            </button>

            <a
                class="btn download"
                href="${song.file}"
                download>
                ⬇ Download
            </a>

        </div>

    `).join("");

}

document
    .getElementById("search")
    .addEventListener("input",displaySongs);

displaySongs();

</script>

</body>
</html>
